# Builds the mod on every push and pull request, and runs the in-game tests
# (src/gametest) where the branch has them. Each Minecraft version lives on its
# own branch, and every branch carries this same file.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # One JDK builds every branch: older versions compile with `--release <n>`.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: yap-chat-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Loom starts its own virtual display (Xvfb) for the client on Linux; Mesa
      # gives it software OpenGL and Vulkan, as in Fabric API's own CI.
      - name: Install software graphics drivers for the in-game tests
        if: hashFiles('src/gametest/**') != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb mesa-vulkan-drivers libgl1-mesa-dri

      - name: In-game tests
        if: hashFiles('src/gametest/**') != ''
        timeout-minutes: 15
        run: ./gradlew runClientGameTest --stacktrace

      - name: Upload test screenshots and logs
        if: always() && hashFiles('src/gametest/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ github.run_number }}
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
          if-no-files-found: ignore
