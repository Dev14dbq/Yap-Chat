plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
	mavenCentral()
	maven { url "https://maven.fabricmc.net/" }
}

loom {
	accessWidenerPath = file("src/main/resources/yap-chat.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"yap-chat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Skip Realms connectivity check in dev environment to speed up loading
			vmArg "-Dnet.minecraft.realms.realmsclient.com.mojang=localhost"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu (compileOnly: рантайм-jar уже лежит в run/mods)
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}", { transitive = false }
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}", { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}

// ── Unit tests ─────────────────────────────────────────────────────────────
// Tests live in src/test and exercise client-side classes that need no running game
// (message classification, component helpers).
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// ── In-game check ──────────────────────────────────────────────────────────
// Minecraft 1.21.1 has no Fabric client gametest API. ./gradlew runAutotest starts a dev client
// with a small driver (src/autotest, not part of the mod jar) that creates a world, sends every
// kind of message, checks the classification, takes screenshots (run-autotest/screenshots) and quits.
sourceSets {
	autotest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

loom {
	mods {
		"yap-chat-autotest" {
			sourceSet sourceSets.autotest
		}
	}
	runs {
		autotest {
			client()
			name "Autotest"
			source sourceSets.autotest
			runDir "run-autotest"
			vmArg "-Dyap.autotest=1"
			vmArg "-Dnet.minecraft.realms.realmsclient.com.mojang=localhost"
		}
	}
}
